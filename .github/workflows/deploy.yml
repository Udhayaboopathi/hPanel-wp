name: Deploy Own hPanel

# Production deployment. The self-hosted runner runs ON the target server
# itself (see docs/CICD.md), so this workflow deploys locally on that host:
# there are NO SSH steps and no SSH secrets. All configuration comes from
# GitHub Secrets (repository or the `production` environment) - primarily
# ONE secret, HPANEL_ENV, holding a whole .env-style blob; individual
# secrets (PANEL_DOMAIN, DB_ADMIN_PASSWORD, ...) are the fallback. The DB
# admin password is handled file-only: it never enters the compose .env,
# because its `$` characters would be corrupted by Compose interpolation.
#
# Safety contract:
#   - only panel-owned resources are created/updated (own-hpanel panel
#     container, the dedicated wordpress-mariadb DB container defined in
#     compose.yaml, own-hpanel-agent systemd service, /opt/own-hpanel data)
#   - the existing Traefik (redberyl-traefik) is reused, never touched
#   - the database is the stack's OWN dedicated MariaDB container
#     (wordpress-mariadb): compose pulls the image and runs it; ALL its
#     config is in compose.yaml and its passwords are file-based secrets
#   - the pre-existing production MariaDB (construction-mariadb) is NOT
#     used by this stack at all: never exec'd into, never connected,
#     never created/stopped/restarted/removed - it is purely protected
#   - docker ps is snapshotted BEFORE and AFTER; the deploy FAILS if any of
#     the 10 pre-existing production containers changed or disappeared
#   - no docker prune, no compose down of anything else, ever

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm production deploy"
        required: true
        type: choice
        options:
          - deploy

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DB_CONTAINER: wordpress-mariadb
  PROTECTED_CONTAINERS: "krweb-ui redberyl-api redberyl-ui redberyl-rustfs redberyl-postgres construction-api construction-ui construction-mariadb redberyl-postgres-proxy redberyl-traefik"

jobs:
  deploy:
    name: Deploy (self-hosted, on-server)
    runs-on: [self-hosted, linux]
    environment: production
    steps:
      - name: Guard - this runner must be the target server
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hpanel-snapshots"
          echo "SNAP_DIR=${RUNNER_TEMP}/hpanel-snapshots" >> "$GITHUB_ENV"
          if [ "$(id -u)" -eq 0 ]; then echo "SUDO=" >> "$GITHUB_ENV"; else echo "SUDO=sudo" >> "$GITHUB_ENV"; fi
          command -v docker >/dev/null || { echo "::error::docker not found - this workflow must run on the target server's self-hosted runner"; exit 1; }
          command -v rsync >/dev/null || { echo "::error::rsync not found on the runner host (apt install rsync)"; exit 1; }
          docker ps --format '{{.Names}}' | grep -qx 'redberyl-traefik' || { echo "::error::redberyl-traefik is not visible from this runner - wrong host, refusing to deploy"; exit 1; }
          if [ "$(id -u)" -ne 0 ] && ! sudo -n true 2>/dev/null; then
            echo "::error::the runner user needs passwordless sudo to install the agent systemd unit (or run the runner as root)"
            exit 1
          fi
          echo "Runner host: $(hostname) - target server confirmed (existing Traefik visible; the dedicated DB container $DB_CONTAINER is created by compose during this deploy, so it need not exist yet)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot production containers (BEFORE)
        run: |
          set -euo pipefail
          docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.Status}}' > "${SNAP_DIR}/docker-before.txt"
          : > "${SNAP_DIR}/protected-before.txt"
          for c in $PROTECTED_CONTAINERS; do
            id="$(docker inspect -f '{{.Id}}' "$c" 2>/dev/null || echo MISSING)"
            echo "$c $id" >> "${SNAP_DIR}/protected-before.txt"
          done
          cat "${SNAP_DIR}/docker-before.txt"

      - name: Verify prerequisites (existing Traefik, network, disk)
        run: |
          set -euo pipefail
          docker network inspect redberyl-internal >/dev/null 2>&1 || { echo "::error::Docker network redberyl-internal is missing - aborting, nothing was changed"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' redberyl-traefik)" = "true" ] || { echo "::error::redberyl-traefik is not running - aborting"; exit 1; }
          avail_kb="$(df -k --output=avail / | tail -1 | tr -d ' ')"
          [ "$((avail_kb / 1024))" -gt 5120 ] || { echo "::error::less than 5 GB free disk - aborting"; exit 1; }
          echo "Prerequisites OK: network, Traefik, >5 GB free disk (the DB container is panel-owned and created by compose - no pre-existing DB is required or used)"

      - name: Load configuration (HPANEL_ENV secret, or individual secrets)
        env:
          HPANEL_ENV: ${{ secrets.HPANEL_ENV }}
          S_PANEL_DOMAIN: ${{ secrets.PANEL_DOMAIN }}
          S_SERVER_IP: ${{ secrets.SERVER_IP }}
          S_DB_HOST: ${{ secrets.DB_HOST }}
          S_DB_EXTERNAL_PORT: ${{ secrets.DB_EXTERNAL_PORT }}
          S_DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          S_DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          S_PANEL_DB_NAME: ${{ secrets.PANEL_DB_NAME }}
          S_DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # The DB admin password is FILE-ONLY: it is written straight to
          # /opt/own-hpanel/secrets/db_admin_password.txt (0600) and never
          # exported, never put in the compose .env (its `$` characters
          # would be corrupted by Docker Compose interpolation) and never
          # printed - only key NAMES are ever echoed.
          pwfile=/opt/own-hpanel/secrets/db_admin_password.txt
          write_pw() {
            $SUDO install -d -m 750 /opt/own-hpanel/secrets
            printf '%s' "$1" | $SUDO tee "$pwfile" >/dev/null
            $SUDO chmod 600 "$pwfile"
          }
          if [ -n "${HPANEL_ENV:-}" ]; then
            echo "HPANEL_ENV detected - parsing it (values are never printed)"
            found=""
            pw_found=""
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in ''|'#'*) continue ;; esac
              case "$line" in *=*) ;; *) echo "::warning::ignoring a malformed HPANEL_ENV line (no '=' in it)"; continue ;; esac
              key="${line%%=*}"
              value="${line#*=}"
              case "$key" in
                PANEL_DOMAIN|SERVER_IP|DB_HOST|DB_EXTERNAL_PORT|DB_ADMIN_USER|PANEL_DB_NAME|DEPLOY_DIR)
                  printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                  found="${found} ${key}"
                  ;;
                DB_ADMIN_PASSWORD)
                  write_pw "$value"
                  pw_found=1
                  found="${found} DB_ADMIN_PASSWORD(file-only)"
                  ;;
                *)
                  echo "::warning::ignoring unknown HPANEL_ENV key: ${key}"
                  ;;
              esac
            done <<< "$HPANEL_ENV"
            echo "HPANEL_ENV keys loaded:${found}"
            [ -n "$pw_found" ] || { echo "::error::HPANEL_ENV has no DB_ADMIN_PASSWORD line - the DB admin password is required"; exit 1; }
          else
            echo "HPANEL_ENV secret is empty - falling back to individual secrets"
            [ -n "${S_DB_ADMIN_PASSWORD:-}" ] || { echo "::error::no DB admin password available: set the HPANEL_ENV secret (with a DB_ADMIN_PASSWORD= line) or the DB_ADMIN_PASSWORD secret"; exit 1; }
            write_pw "$S_DB_ADMIN_PASSWORD"
            if [ -n "${S_PANEL_DOMAIN:-}" ]; then echo "PANEL_DOMAIN=$S_PANEL_DOMAIN" >> "$GITHUB_ENV"; fi
            if [ -n "${S_SERVER_IP:-}" ]; then echo "SERVER_IP=$S_SERVER_IP" >> "$GITHUB_ENV"; fi
            if [ -n "${S_DB_HOST:-}" ]; then echo "DB_HOST=$S_DB_HOST" >> "$GITHUB_ENV"; fi
            if [ -n "${S_DB_EXTERNAL_PORT:-}" ]; then echo "DB_EXTERNAL_PORT=$S_DB_EXTERNAL_PORT" >> "$GITHUB_ENV"; fi
            if [ -n "${S_DB_ADMIN_USER:-}" ]; then echo "DB_ADMIN_USER=$S_DB_ADMIN_USER" >> "$GITHUB_ENV"; fi
            if [ -n "${S_PANEL_DB_NAME:-}" ]; then echo "PANEL_DB_NAME=$S_PANEL_DB_NAME" >> "$GITHUB_ENV"; fi
            if [ -n "${S_DEPLOY_DIR:-}" ]; then echo "DEPLOY_DIR=$S_DEPLOY_DIR" >> "$GITHUB_ENV"; fi
            echo "individual secrets loaded; DB admin password written file-only"
          fi
          echo "DB admin password file ready at $pwfile (0600, value never printed)"

      - name: Resolve deploy directory
        run: |
          set -euo pipefail
          dir="${DEPLOY_DIR:-/opt/own-hpanel/app}"
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"
          echo "Deploy directory: $dir"

      - name: Sync source to deploy directory
        run: |
          set -euo pipefail
          $SUDO install -d -m 755 -o "$(id -un)" -g "$(id -gn)" "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.deploy-snapshots' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_DIR}/"
          echo "Source synced to $DEPLOY_DIR (.env preserved - it is rewritten from Secrets in the next step)"

      - name: Write compose .env (never printed, NO DB password in it)
        run: |
          set -euo pipefail
          # Values come from the "Load configuration" step ($GITHUB_ENV).
          [ -n "${PANEL_DOMAIN:-}" ] || { echo "::error::PANEL_DOMAIN is not configured - set it in the HPANEL_ENV secret (PANEL_DOMAIN=...) or as an individual PANEL_DOMAIN secret"; exit 1; }
          cd "$DEPLOY_DIR"
          umask 077
          # DB_ADMIN_PASSWORD is deliberately NOT written here, in either
          # mode: the password contains `$`, which Docker Compose would
          # interpolate/corrupt when reading .env. It exists only in
          # /opt/own-hpanel/secrets/db_admin_password.txt (see compose.yaml:
          # DB_ADMIN_PASSWORD_FILE + the read-only secrets mount).
          {
            printf 'PANEL_DOMAIN=%s\n' "$PANEL_DOMAIN"
            printf 'SERVER_IP=%s\n' "${SERVER_IP:-130.210.42.20}"
            printf 'DB_HOST=%s\n' "${DB_HOST:-db.krwebsolution.com}"
            printf 'DB_EXTERNAL_PORT=%s\n' "${DB_EXTERNAL_PORT:-3024}"
            printf 'DB_ADMIN_USER=%s\n' "${DB_ADMIN_USER:-WordPress_common_DB}"
            printf 'PANEL_DB_NAME=%s\n' "${PANEL_DB_NAME:-hpanel_panel}"
            printf 'PANEL_STORE_DRIVER=mysql\n'
          } > .env.tmp
          mv .env.tmp .env
          chmod 600 .env
          echo ".env written (keys: PANEL_DOMAIN SERVER_IP DB_HOST DB_EXTERNAL_PORT DB_ADMIN_USER PANEL_DB_NAME PANEL_STORE_DRIVER) - DB password intentionally excluded (file-only)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test and build
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          mkdir -p "${RUNNER_TEMP}/hpanel-bin"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/hpanel-bin/agent" ./cmd/agent
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/hpanel-bin/panel" ./cmd/panel
          ls -lh "${RUNNER_TEMP}/hpanel-bin"

      - name: Install agent binary and systemd unit
        run: |
          set -euo pipefail
          # The DB admin password file was already written (0600) by the
          # "Load configuration" step, before this step and before the
          # ensure-panel-DB step - this step never handles the password.
          $SUDO test -s /opt/own-hpanel/secrets/db_admin_password.txt || { echo "::error::DB admin password file is missing - the Load configuration step did not run or failed"; exit 1; }
          $SUDO install -d -m 750 /opt/own-hpanel/bin /opt/own-hpanel/secrets /opt/own-hpanel/websites /opt/own-hpanel/backups /opt/own-hpanel/logs
          $SUDO install -m 755 "${RUNNER_TEMP}/hpanel-bin/agent" /opt/own-hpanel/bin/agent
          # Agent token: generated once, never overwritten, never printed.
          if ! $SUDO test -f /opt/own-hpanel/secrets/agent.token; then
            openssl rand -hex 32 | $SUDO tee /opt/own-hpanel/secrets/agent.token >/dev/null
            $SUDO chmod 600 /opt/own-hpanel/secrets/agent.token
            echo "agent token generated"
          fi
          $SUDO install -m 644 "${DEPLOY_DIR}/deployment/own-hpanel-agent.service" /etc/systemd/system/own-hpanel-agent.service
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable own-hpanel-agent >/dev/null
          $SUDO systemctl restart own-hpanel-agent
          for i in $(seq 1 30); do
            [ -S /run/own-hpanel/agent.sock ] && break
            sleep 1
          done
          [ -S /run/own-hpanel/agent.sock ] || { echo "::error::agent socket did not appear; check: systemctl status own-hpanel-agent"; exit 1; }
          $SUDO systemctl is-active own-hpanel-agent
          # Panel reads the agent token through the shared /run/own-hpanel mount.
          $SUDO cp /opt/own-hpanel/secrets/agent.token /run/own-hpanel/agent.token
          $SUDO chmod 640 /run/own-hpanel/agent.token
          echo "agent installed and running (panel-owned service only)"

      - name: Generate the MariaDB root password file if missing (server-side only)
        run: |
          set -euo pipefail
          rootpw_file=/opt/own-hpanel/secrets/mariadb_root_password.txt
          if $SUDO test -s "$rootpw_file"; then
            echo "MariaDB root password file already exists (never overwritten, value never printed)"
          else
            $SUDO install -d -m 750 /opt/own-hpanel/secrets
            openssl rand -hex 24 | $SUDO tee "$rootpw_file" >/dev/null
            $SUDO chmod 600 "$rootpw_file"
            echo "MariaDB root password generated into $rootpw_file (0600, value never printed)"
          fi
          echo "Note: this password becomes the root password of the dedicated wordpress-mariadb container on its FIRST initialization (empty data volume). If the volume was already initialized earlier, the file must match the root password set back then - the ensure step below fails loudly if it does not."

      - name: Build and start the hPanel stack (panel + dedicated MariaDB, panel-owned only)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # The compose file defines ONLY panel-owned services:
          # wordpress-mariadb (the stack's OWN dedicated DB container -
          # image pulled by compose, all config in compose.yaml,
          # file-based secrets) and own-hpanel (depends_on the DB being
          # healthy). Nothing pre-existing can be started/stopped by it.
          docker compose build
          docker compose up -d
          # Wait for the dedicated DB container to become healthy.
          dbhealth=""
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' "$DB_CONTAINER" 2>/dev/null || echo missing)"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$DB_CONTAINER" 2>/dev/null || echo unknown)"
            echo "attempt $i: $DB_CONTAINER container=$status health=$health"
            if [ "$status" = "running" ] && [ "$health" = "healthy" ]; then dbhealth=1; break; fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              docker logs --tail 100 "$DB_CONTAINER" || true
              echo "::error::dedicated MariaDB container $DB_CONTAINER is $status"
              exit 1
            fi
            sleep 3
          done
          [ -n "$dbhealth" ] || { docker logs --tail 100 "$DB_CONTAINER" || true; echo "::error::dedicated MariaDB container $DB_CONTAINER did not become healthy in time"; exit 1; }
          docker ps --filter "name=$DB_CONTAINER" --filter 'name=own-hpanel' --format '{{.Names}} {{.Status}}'
          echo "stack is up: dedicated MariaDB ($DB_CONTAINER) healthy; panel starts once its DB dependency is healthy"

      - name: Ensure the panel database and provisioning grants (root exec into wordpress-mariadb)
        run: |
          set -euo pipefail
          user="${DB_ADMIN_USER:-WordPress_common_DB}"
          dbname="${PANEL_DB_NAME:-hpanel_panel}"
          # These identifiers are interpolated into the generated SQL:
          # only plain identifiers are acceptable (the panel validates
          # identifiers the same way).
          case "$user" in *[!A-Za-z0-9_]*) echo "::error::DB_ADMIN_USER is not a plain identifier - refusing to build SQL with it"; exit 1 ;; esac
          case "$dbname" in *[!A-Za-z0-9_]*) echo "::error::PANEL_DB_NAME is not a plain identifier - refusing to build SQL with it"; exit 1 ;; esac
          rootpw_file=/opt/own-hpanel/secrets/mariadb_root_password.txt
          userpw_file=/opt/own-hpanel/secrets/db_admin_password.txt
          $SUDO test -s "$rootpw_file" || { echo "::error::MariaDB root password file $rootpw_file is missing/empty - the root-password generation step should have written it"; exit 1; }
          $SUDO test -s "$userpw_file" || { echo "::error::DB admin password file $userpw_file is missing/empty - the Load configuration step should have written it"; exit 1; }
          # Load both passwords silently (no echo, no set -x). They reach
          # the mariadb client via MYSQL_PWD passed by NAME only - never
          # in argv, never printed.
          root_pw="$($SUDO cat "$rootpw_file")"
          user_pw="$($SUDO cat "$userpw_file")"
          # The user password is embedded in the generated SQL as a
          # single-quoted literal: escape it by doubling single quotes
          # (the SQL-standard escape) and refuse CR/LF outright - a line
          # break would terminate the literal and inject statements.
          case "$user_pw" in *$'\n'*|*$'\r'*) echo "::error::the DB admin password contains a newline/CR character, which cannot be embedded safely in generated SQL - rotate it to a password without line breaks"; exit 1 ;; esac
          user_pw_sql="${user_pw//\'/\'\'}"
          sql_file="$(mktemp)"
          chmod 600 "$sql_file"
          trap 'shred -u "$sql_file" 2>/dev/null || rm -f "$sql_file"' EXIT
          {
            printf 'CREATE DATABASE IF NOT EXISTS `%s` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n' "$dbname"
            printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\n" "$user" "$user_pw_sql"
            printf "ALTER USER '%s'@'%%' IDENTIFIED BY '%s';\n" "$user" "$user_pw_sql"
            printf "CREATE USER IF NOT EXISTS '%s'@'localhost' IDENTIFIED BY '%s';\n" "$user" "$user_pw_sql"
            printf "ALTER USER '%s'@'localhost' IDENTIFIED BY '%s';\n" "$user" "$user_pw_sql"
            printf "GRANT ALL PRIVILEGES ON *.* TO '%s'@'%%' WITH GRANT OPTION;\n" "$user"
            printf "GRANT ALL PRIVILEGES ON *.* TO '%s'@'localhost' WITH GRANT OPTION;\n" "$user"
            printf 'FLUSH PRIVILEGES;\n'
          } > "$sql_file"
          # Why root exec + a generated SQL file: the MariaDB entrypoint
          # grants the common user rights only on the panel database, and
          # deployment/mariadb-init/01-grants.sh runs only on FIRST
          # initialization of an empty volume. This step repeats the same
          # setup idempotently on EVERY deploy (existing volumes
          # included): panel DB exists, the common user exists with the
          # secret's current password (ALTER USER syncs rotations), and
          # it holds full provisioning grants ON THIS CONTAINER ONLY.
          if ! MYSQL_PWD="$root_pw" docker exec -i -e MYSQL_PWD "$DB_CONTAINER" mariadb -uroot < "$sql_file"; then
            echo "::error::could not initialise database ${dbname} / provisioning user ${user} inside ${DB_CONTAINER} as root. Check that the root password file matches this container's actual root password (it is fixed at first initialization of the data volume; if the volume was initialised with a different one, update $rootpw_file to match) and that the container is healthy."
            exit 1
          fi
          if ! MYSQL_PWD="$user_pw" docker exec -e MYSQL_PWD "$DB_CONTAINER" mariadb -u"$user" -e "USE \`${dbname}\`; SELECT 1;" >/dev/null; then
            echo "::error::panel database ${dbname} is not usable by ${user} inside ${DB_CONTAINER} even after the root ensure step - investigate the MariaDB logs (docker logs $DB_CONTAINER) before re-running."
            exit 1
          fi
          unset root_pw user_pw user_pw_sql
          echo "panel database ${dbname} exists; common user ${user} holds provisioning grants on ${DB_CONTAINER} (this container only) - verified as root and as ${user}"
          # WARNING-ONLY: external endpoint reachability. The external
          # endpoint (DB_HOST:DB_EXTERNAL_PORT, i.e. the published port of
          # wordpress-mariadb) exists for testing/admin access only - the
          # panel and WordPress sites connect internally and do NOT use
          # it, so a failure here never fails the deploy.
          host="${DB_HOST:-db.krwebsolution.com}"
          port="${DB_EXTERNAL_PORT:-3024}"
          if timeout 3 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null; then
            echo "external DB endpoint ${host}:${port} is reachable over TCP (testing/admin access to the published MariaDB port)"
          else
            echo "::warning::external DB endpoint ${host}:${port} is not reachable over TCP. Expected while the Cloudflare record for ${host} is Proxied (Cloudflare does not forward MariaDB traffic). This does NOT affect the deploy, the panel, or the WordPress sites (they connect internally). For direct external MariaDB access, set the ${host} DNS record to DNS-only (grey cloud)."
          fi

      - name: Verify panel health
        # PANEL_DOMAIN comes from the Load configuration step ($GITHUB_ENV),
        # not from an individual secret - do NOT re-add a secrets.* env here,
        # it would shadow the parsed HPANEL_ENV value with an empty one.
        run: |
          set -euo pipefail
          healthy=""
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}}' own-hpanel 2>/dev/null || echo missing)"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' own-hpanel 2>/dev/null || echo unknown)"
            echo "attempt $i: container=$status health=$health"
            if [ "$status" = "running" ] && { [ "$health" = "healthy" ] || [ "$health" = "none" ]; }; then healthy=1; break; fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              docker logs --tail 100 own-hpanel || true
              echo "::error::panel container is $status"
              exit 1
            fi
            sleep 3
          done
          [ -n "$healthy" ] || { docker logs --tail 100 own-hpanel || true; echo "::error::panel container did not become healthy in time"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${PANEL_DOMAIN}/healthz" || echo 000)"
          echo "PANEL_HTTPS_CODE=$code" >> "$GITHUB_ENV"
          if [ "$code" = "200" ]; then
            echo "panel is reachable at https://${PANEL_DOMAIN}/healthz (200)"
          else
            echo "::warning::panel container is healthy but https://${PANEL_DOMAIN}/healthz returned $code - this is usually SSL-pending (Let's Encrypt not issued yet, DNS not pointing at the server, or Cloudflare in front). The deploy itself succeeded; verify DNS for ${PANEL_DOMAIN} and check Traefik."
          fi

      - name: Snapshot production containers (AFTER) and diff protected set
        run: |
          set -euo pipefail
          docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.Status}}' > "${SNAP_DIR}/docker-after.txt"
          : > "${SNAP_DIR}/protected-after.txt"
          for c in $PROTECTED_CONTAINERS; do
            id="$(docker inspect -f '{{.Id}}' "$c" 2>/dev/null || echo MISSING)"
            echo "$c $id" >> "${SNAP_DIR}/protected-after.txt"
          done
          if ! diff -u "${SNAP_DIR}/protected-before.txt" "${SNAP_DIR}/protected-after.txt"; then
            echo "::error::PRODUCTION PROTECTION FAILURE: at least one pre-existing production container changed ID or disappeared during the deploy. Investigate immediately with the uploaded snapshots."
            exit 1
          fi
          echo "production protection check passed: all 10 pre-existing containers unchanged"

      - name: Upload deploy snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-snapshots-${{ github.run_id }}
          path: ${{ env.SNAP_DIR }}
          if-no-files-found: ignore

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Own hPanel deploy"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Panel: https://${PANEL_DOMAIN:-unknown} (healthz HTTPS code: ${PANEL_HTTPS_CODE:-not checked})"
            echo "- Database: dedicated panel-owned MariaDB (${DB_CONTAINER}) defined in compose.yaml, panel DB ${PANEL_DB_NAME:-hpanel_panel}; construction-mariadb is NOT used by the stack and must be unchanged (protected check)"
            echo "- Protected containers: IDs compared before/after (see artifact deploy-snapshots-${GITHUB_RUN_ID})"
            echo ""
            echo "Rollback: re-run this workflow from a previous commit, or git revert + push. See docs/CICD.md."
          } >> "$GITHUB_STEP_SUMMARY"
