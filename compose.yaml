# Own hPanel stack. Deploys ONLY panel-owned resources: the `own-hpanel`
# panel container, the `own-hpanel-agent` provisioning-agent container and
# the dedicated `wordpress-mariadb` database container.
#
# DATABASE: this stack runs its OWN MariaDB container (service
# `wordpress-mariadb` below) - the image is pulled and the container is
# created/started by `docker compose up`, and ALL of its configuration lives
# in this file. It serves the panel's own metadata database AND every
# WordPress site (one database + one dedicated user per site, provisioned by
# the common admin account). It is labelled own-hpanel.managed=true and is
# the ONLY database the panel/agent ever talk to.
#
# The pre-existing production `construction-mariadb` container is NOT used
# by this stack in any way: it is never referenced here, never exec'd into,
# never network-connected, never stopped/restarted. It belongs to the
# existing production stack and stays purely protected (the deploy workflow
# snapshots it before/after and fails if it changes).
#
# Secrets are FILE-based only (compose `secrets:` below, files under
# /opt/own-hpanel/secrets/ with 0600 permissions). No password is ever a
# literal in this file or interpolated via ${...}: the DB passwords contain
# `$`, which Compose would corrupt during interpolation. The panel's own
# copy of the DB admin password is staged into its panel-data volume by
# the deploy (see the panel service comments) - the host secrets directory
# is never mounted into the panel container.
#
# The provisioning agent is the `agent` service below: a container that
# holds /var/run/docker.sock (the ONLY container that does) plus the host
# site/backup directories, and serves the panel over a Unix socket in the
# shared /run/own-hpanel directory. It is never network-exposed. (It used
# to run as a host systemd service; the container form needs exactly the
# same privilege - Docker socket access is host-root equivalent - and
# lets the whole deploy run without any host privilege escalation. The
# old unit is kept, deprecated, at deployment/own-hpanel-agent.service.)
# Existing production containers are not referenced or modified here.
services:
  wordpress-mariadb:
    image: mariadb:11.4
    container_name: wordpress-mariadb
    restart: unless-stopped
    environment:
      # On first initialization of the data volume, the entrypoint creates
      # MARIADB_DATABASE and MARIADB_USER (granted on that database) and
      # sets the root password - all read from the secret FILES below.
      # deployment/mariadb-init/01-grants.sh then upgrades the common user
      # to a full provisioning admin OF THIS CONTAINER ONLY.
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_DATABASE: ${PANEL_DB_NAME:-hpanel_panel}
      MARIADB_USER: ${DB_ADMIN_USER:-WordPress_common_DB}
      MARIADB_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - mariadb_root_password
      - db_admin_password
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=150
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Published on the host for TESTING/admin tools (the external endpoint
    # db.krwebsolution.com:${DB_EXTERNAL_PORT}). In-stack traffic never uses
    # this port - containers reach MariaDB internally on 3306. WARNING: an
    # internet-reachable MariaDB port is an attack surface; restrict it by
    # firewall to your own IPs in production (see docs/CICD.md).
    ports:
      - "${DB_EXTERNAL_PORT:-3024}:3306"
    volumes:
      - wordpress-mariadb-data:/var/lib/mysql
      # First-init provisioning grants for the common admin user. Init
      # scripts run ONLY when the data volume is empty (first boot); the
      # deploy workflow's ensure step repeats the same grants idempotently
      # for already-initialized volumes.
      - ./deployment/mariadb-init/01-grants.sh:/docker-entrypoint-initdb.d/01-grants.sh:ro
    networks:
      - panel-db
    labels:
      own-hpanel.managed: "true"
      own-hpanel.component: "mariadb"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    mem_limit: 512m
    cpus: 0.50
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  panel:
    build:
      context: .
      target: panel
    image: own-hpanel:latest
    container_name: own-hpanel
    restart: unless-stopped
    depends_on:
      wordpress-mariadb:
        condition: service_healthy
    environment:
      PANEL_ADDR: ":8080"
      PANEL_DATA_DIR: /data
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PANEL_SECURE_COOKIES: "true"
      SERVER_IP: ${SERVER_IP:-130.210.42.20}
      AGENT_SOCKET: /run/own-hpanel/agent.sock
      AGENT_TOKEN_FILE: /run/own-hpanel/agent.token
      SITES_DIR: /opt/own-hpanel/websites
      BACKUPS_DIR: /opt/own-hpanel/backups
      # Panel metadata store: the dedicated wordpress-mariadb container
      # (PANEL_STORE_DRIVER=mysql), in its own database PANEL_DB_NAME. The
      # password arrives ONLY as a file staged into the panel-data volume
      # by the deploy workflow / install.sh (a one-shot Docker container
      # copies the host secret in as uid/gid 10001 - see docs/CICD.md):
      # the host secrets directory is deliberately NOT mounted into the
      # panel (its files are root-owned 0600 and the panel runs as
      # 10001, so it could not read them anyway). Nor is the password
      # passed via the .env file or a ${...} substitution: it contains
      # `$`, which Docker Compose would interpolate and corrupt.
      PANEL_STORE_DRIVER: ${PANEL_STORE_DRIVER:-mysql}
      PANEL_DB_NAME: ${PANEL_DB_NAME:-hpanel_panel}
      PANEL_STORE_DSN: ${PANEL_STORE_DSN:-}
      DB_CONTAINER: wordpress-mariadb
      # INTERNAL Docker DNS - the external db.krwebsolution.com:3024
      # endpoint is for outside testing tools; in-stack traffic never
      # leaves Docker, so the panel always connects to the DB container by
      # name on port 3306 (these literals intentionally override any
      # DB_HOST/DB_EXTERNAL_PORT values from the .env file).
      DB_HOST: wordpress-mariadb
      DB_EXTERNAL_PORT: "3306"
      DB_ADMIN_USER: ${DB_ADMIN_USER:-WordPress_common_DB}
      DB_ADMIN_PASSWORD_FILE: /data/db_admin_password.txt
    volumes:
      - panel-data:/data
      # Agent socket directory (socket + token are provisioned by install.sh / CI).
      - /run/own-hpanel:/run/own-hpanel
      # NOTE: /opt/own-hpanel/secrets is NOT mounted here on purpose - see
      # the DB_ADMIN_PASSWORD_FILE comment above. The agent token reaches
      # the panel via /run/own-hpanel/agent.token.
      # Site files for the file manager and backup downloads. NOT the Docker socket.
      - /opt/own-hpanel/websites:/opt/own-hpanel/websites
      - /opt/own-hpanel/backups:/opt/own-hpanel/backups:ro
    networks:
      - traefik
      - panel-db
    labels:
      own-hpanel.managed: "true"
      own-hpanel.component: "panel"
      traefik.enable: "true"
      traefik.docker.network: "redberyl-internal"
      traefik.http.routers.own-hpanel.rule: "Host(`${PANEL_DOMAIN:?set PANEL_DOMAIN}`)"
      traefik.http.routers.own-hpanel.entrypoints: "websecure"
      traefik.http.routers.own-hpanel.tls: "true"
      traefik.http.routers.own-hpanel.tls.certresolver: "letsencrypt"
      traefik.http.routers.own-hpanel.service: "own-hpanel"
      traefik.http.services.own-hpanel.loadbalancer.server.port: "8080"
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.50
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No published ports: Traefik routes all public traffic.

  agent:
    build:
      context: .
      target: agent
    image: own-hpanel-agent:latest
    container_name: own-hpanel-agent
    restart: unless-stopped
    environment:
      AGENT_SOCKET: /run/own-hpanel/agent.sock
      AGENT_TOKEN_FILE: /opt/own-hpanel/secrets/agent.token
      # Dedicated MariaDB of this stack (see the wordpress-mariadb service
      # above): the agent connects as the common admin user, execs the SQL
      # client in that container only (via the Docker socket), and
      # connects it to per-site networks. The external DB_HOST/PORT values
      # describe the outside endpoint for status reporting; provisioning
      # itself happens over the Docker socket, never over TCP.
      DB_CONTAINER: wordpress-mariadb
      DB_HOST: db.krwebsolution.com
      DB_EXTERNAL_PORT: "3024"
      DB_ADMIN_USER: ${DB_ADMIN_USER:-WordPress_common_DB}
      # Password from a 0600 file in the read-only secrets mount below -
      # never a unit/compose literal, never interpolated.
      DB_ADMIN_PASSWORD_FILE: /opt/own-hpanel/secrets/db_admin_password.txt
      DOCKER_SOCKET: /var/run/docker.sock
      SITES_DIR: /opt/own-hpanel/websites
      BACKUPS_DIR: /opt/own-hpanel/backups
    volumes:
      # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      # !!! THE DOCKER SOCKET - AGENT ONLY !!!
      # This mount gives the agent full control of the host's Docker
      # daemon (equivalent to host root). It belongs to the agent service
      # ONLY: NEVER add it to the panel service, to wordpress-mariadb, or
      # to any WordPress site container. The panel talks to the agent
      # over the authenticated Unix socket in /run/own-hpanel instead.
      # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared socket directory: the agent binds agent.sock here; the
      # panel mounts the same host directory and connects to it. The
      # panel's copy of the agent token also lives here
      # (/run/own-hpanel/agent.token, 640 root:10001, staged by the
      # deploy workflow - the agent itself reads the original from the
      # secrets mount below and never uses this copy).
      - /run/own-hpanel:/run/own-hpanel
      - /opt/own-hpanel/secrets:/opt/own-hpanel/secrets:ro
      - /opt/own-hpanel/websites:/opt/own-hpanel/websites
      - /opt/own-hpanel/backups:/opt/own-hpanel/backups
    networks:
      - panel-db
    labels:
      own-hpanel.managed: "true"
      own-hpanel.component: "agent"
    # No Traefik labels and no published ports: the agent is reachable
    # ONLY through its Unix socket - it has no network listener at all.
    mem_limit: 128m
    cpus: 0.25
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  traefik:
    name: redberyl-internal
    external: true
  panel-db:
    name: own-hpanel-db
    labels:
      own-hpanel.managed: "true"

volumes:
  wordpress-mariadb-data:
    name: own-hpanel-wordpress-mariadb-data
    labels:
      own-hpanel.managed: "true"
  panel-data:
    name: own-hpanel-panel-data
    labels:
      own-hpanel.managed: "true"

# File-based secrets ONLY. The files are created on the server with 0600
# permissions (root password: generated by CI/install if missing; common
# user password: written by CI from GitHub Secrets) and are never part of
# this repository.
secrets:
  mariadb_root_password:
    file: /opt/own-hpanel/secrets/mariadb_root_password.txt
  db_admin_password:
    file: /opt/own-hpanel/secrets/db_admin_password.txt
