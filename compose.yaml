# Own hPanel stack. Deploys ONLY the panel-owned `own-hpanel` container.
#
# DATABASE: there is deliberately NO database service in this file. All
# WordPress sites and the panel itself use the ONE pre-existing shared
# MariaDB server on this host (container `construction-mariadb`, MariaDB
# 11.4, external endpoint db.krwebsolution.com:3024). That container belongs
# to the existing production stack: this compose file never creates, stops,
# restarts or otherwise manages it. The agent connects it to per-site Docker
# networks and execs the SQL client in it - nothing more.
#
# The provisioning agent runs on the host via systemd
# (deployment/own-hpanel-agent.service) because it needs
# /var/run/docker.sock + host paths - it is never exposed.
# Existing production containers are not referenced or modified here.
services:
  panel:
    build:
      context: .
      target: panel
    image: own-hpanel:latest
    container_name: own-hpanel
    restart: unless-stopped
    environment:
      PANEL_ADDR: ":8080"
      PANEL_DATA_DIR: /data
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PANEL_SECURE_COOKIES: "true"
      SERVER_IP: ${SERVER_IP:-130.210.42.20}
      AGENT_SOCKET: /run/own-hpanel/agent.sock
      AGENT_TOKEN_FILE: /run/own-hpanel/agent.token
      SITES_DIR: /opt/own-hpanel/websites
      BACKUPS_DIR: /opt/own-hpanel/backups
      # Panel metadata store: the shared MariaDB (PANEL_STORE_DRIVER=mysql),
      # its own database PANEL_DB_NAME, via the external DB endpoint and the
      # common admin account. The password arrives ONLY via the .env file
      # (written by CI from GitHub Secrets, chmod 600) - never a literal here.
      PANEL_STORE_DRIVER: ${PANEL_STORE_DRIVER:-mysql}
      PANEL_DB_NAME: ${PANEL_DB_NAME:-hpanel_panel}
      PANEL_STORE_DSN: ${PANEL_STORE_DSN:-}
      DB_CONTAINER: ${DB_CONTAINER:-construction-mariadb}
      DB_HOST: ${DB_HOST:-db.krwebsolution.com}
      DB_EXTERNAL_PORT: ${DB_EXTERNAL_PORT:-3024}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-WordPress_common_DB}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env (sourced from GitHub Secrets)}
    volumes:
      - panel-data:/data
      # Agent socket directory (socket + token are provisioned by install.sh / CI).
      - /run/own-hpanel:/run/own-hpanel
      # Site files for the file manager and backup downloads. NOT the Docker socket.
      - /opt/own-hpanel/websites:/opt/own-hpanel/websites
      - /opt/own-hpanel/backups:/opt/own-hpanel/backups:ro
    networks:
      - traefik
    labels:
      own-hpanel.managed: "true"
      own-hpanel.component: "panel"
      traefik.enable: "true"
      traefik.docker.network: "redberyl-internal"
      traefik.http.routers.own-hpanel.rule: "Host(`${PANEL_DOMAIN:?set PANEL_DOMAIN}`)"
      traefik.http.routers.own-hpanel.entrypoints: "websecure"
      traefik.http.routers.own-hpanel.tls: "true"
      traefik.http.routers.own-hpanel.tls.certresolver: "letsencrypt"
      traefik.http.routers.own-hpanel.service: "own-hpanel"
      traefik.http.services.own-hpanel.loadbalancer.server.port: "8080"
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.50
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No published ports: Traefik routes all public traffic.

networks:
  traefik:
    name: redberyl-internal
    external: true

volumes:
  panel-data:
    name: own-hpanel-panel-data
    labels:
      own-hpanel.managed: "true"
